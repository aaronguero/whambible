<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhamBible — Battle!</title>
  <meta name="theme-color" content="#c9a227" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="game.css" />

<style>
/* == WHAM MENU + BIBLE VERSES == */

/* ============================================================
   DROPDOWN MENU — exact Whamgame structure
   ============================================================ */
@keyframes menuFade {
  from { opacity: 0; transform: translateY(-8px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)   scale(1);     }
}

.wham-menu-wrap {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 3000;
}

/* Hamburger toggle button */
.wham-menu-btn {
  width: 44px;
  height: 44px;
  background: rgba(15, 23, 42, 0.90);
  border: 1px solid #334155;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.wham-menu-btn.open {
  background: rgba(201, 162, 39, 0.15);
  border-color: #c9a227;
}
.wham-menu-btn .bar {
  width: 18px;
  height: 2px;
  background: #94a3b8;
  border-radius: 2px;
  transition: all 0.22s ease;
}
.wham-menu-btn.open .bar { background: #c9a227; }
.wham-menu-btn.open .bar:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.wham-menu-btn.open .bar:nth-child(2) { opacity: 0; }
.wham-menu-btn.open .bar:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* Dropdown panel */
.wham-menu-panel {
  position: absolute;
  top: 52px;
  right: 0;
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  min-width: 220px;
  animation: menuFade 0.15s ease;
}

/* Each menu row */
.wham-menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 18px;
  background: transparent;
  border: none;
  border-bottom: 1px solid #1e293b;
  color: #e2e8f0;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
  text-decoration: none;
}
.wham-menu-item:last-child { border-bottom: none; }
.wham-menu-item:hover { background: rgba(201, 162, 39, 0.10); }
.wham-menu-item .m-icon { font-size: 18px; }
.wham-menu-item .m-label { flex: 1; }

/* PRO badge (locked items) */
.wham-menu-badge-pro {
  font-size: 10px;
  background: linear-gradient(135deg, #c9a227, #a07720);
  color: #fff;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

/* Theme sub-menu toggle */
.wham-menu-item.theme-toggle .m-arrow {
  font-size: 12px;
  color: #64748b;
  transition: transform 0.2s;
}
.wham-menu-item.theme-toggle.sub-open .m-arrow { transform: rotate(180deg); }

/* Theme submenu rows */
.wham-submenu {
  background: rgba(15, 23, 42, 0.95);
  border-top: 1px solid #1e293b;
  display: none;
}
.wham-submenu.open { display: block; }
.wham-submenu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 18px 11px 32px;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(30, 41, 59, 0.6);
  color: #e2e8f0;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.wham-submenu-item:last-child { border-bottom: none; }
.wham-submenu-item:hover { background: rgba(201,162,39,0.08); }
.wham-submenu-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 800;
}
.wham-submenu-badge.owned {
  background: rgba(74,222,128,0.15);
  color: #4ade80;
  border: 1px solid #4ade80;
}
.wham-submenu-badge.price {
  background: rgba(201,162,39,0.15);
  color: #c9a227;
  border: 1px solid #c9a227;
}

/* Divider inside menu */
.wham-menu-divider {
  height: 1px;
  background: #1e293b;
  margin: 0;
}

/* Sign out row — red tint */
.wham-menu-item.signout { color: #f87171; }
.wham-menu-item.signout:hover { background: rgba(248,113,113,0.08); }

/* ── Bible Verses modal ── */
#bv-modal-overlay {
  position: fixed; inset: 0; z-index: 4000;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  animation: menuFade 0.18s ease;
}
#bv-modal {
  background: #0f172a;
  border: 1px solid #c9a227;
  border-radius: 20px;
  width: min(92vw, 480px);
  max-height: 88vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 12px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,162,39,0.2);
}
#bv-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid #1e293b;
  display: flex; align-items: center; gap: 10px;
}
#bv-header h2 {
  flex: 1; margin: 0;
  font-family: 'Cinzel', serif;
  font-size: 17px; font-weight: 700;
  color: #c9a227; letter-spacing: 0.5px;
}
#bv-close {
  background: transparent; border: none;
  color: #64748b; font-size: 22px; cursor: pointer;
  line-height: 1; padding: 2px 6px; border-radius: 6px;
  transition: color 0.15s;
}
#bv-close:hover { color: #f87171; }

/* Wheels row */
#bv-wheels {
  display: flex; gap: 8px;
  padding: 18px 20px 10px;
  justify-content: center;
}
.bv-wheel-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.bv-wheel-label {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  color: #64748b; text-transform: uppercase;
}
.bv-wheel-outer {
  position: relative;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
  background: #020617;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.bv-wheel-outer:active { cursor: grabbing; }
/* Book wider, ch/vs narrower */
#bv-wheel-book   .bv-wheel-outer { width: 148px; height: 160px; }
#bv-wheel-ch     .bv-wheel-outer { width: 64px;  height: 160px; }
#bv-wheel-vs     .bv-wheel-outer { width: 64px;  height: 160px; }

.bv-wheel-inner {
  position: absolute; left: 0; right: 0; top: 0;
  transition: transform 0.12s cubic-bezier(.22,.68,0,1.2);
}
.bv-wheel-cell {
  display: flex; align-items: center; justify-content: center;
  height: 40px;
  font-family: 'Crimson Text', serif;
  font-size: 14px; font-weight: 600;
  color: #94a3b8;
  transition: color 0.15s, font-size 0.15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 8px;
}
.bv-wheel-cell.selected {
  color: #c9a227; font-size: 15px; font-weight: 700;
}
/* Gradient masks top/bottom */
.bv-wheel-outer::before,
.bv-wheel-outer::after {
  content: ''; position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none;
  height: 52px;
}
.bv-wheel-outer::before { top: 0;    background: linear-gradient(to bottom, #020617 0%, transparent 100%); }
.bv-wheel-outer::after  { bottom: 0; background: linear-gradient(to top,    #020617 0%, transparent 100%); }
/* Selector band */
.bv-selector-band {
  position: absolute; left: 6px; right: 6px;
  top: 60px; height: 40px;
  border-top: 1px solid rgba(201,162,39,0.5);
  border-bottom: 1px solid rgba(201,162,39,0.5);
  background: rgba(201,162,39,0.07);
  border-radius: 6px;
  pointer-events: none; z-index: 3;
}

/* Read Verse button */
#bv-read-btn {
  margin: 10px 20px 0;
  padding: 13px;
  background: linear-gradient(135deg, #c9a227, #a07720);
  border: none; border-radius: 12px;
  color: #0f172a; font-size: 15px; font-weight: 800;
  font-family: 'Cinzel', serif; letter-spacing: 0.5px;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  width: calc(100% - 40px);
}
#bv-read-btn:hover  { opacity: 0.9; }
#bv-read-btn:active { transform: scale(0.98); }

/* Reading pane */
#bv-reading-pane {
  margin: 12px 20px 20px;
  padding: 18px;
  background: rgba(201,162,39,0.06);
  border: 1px solid rgba(201,162,39,0.2);
  border-radius: 14px;
  display: none;
  animation: menuFade 0.2s ease;
}
#bv-reading-ref {
  font-family: 'Cinzel', serif;
  font-size: 13px; font-weight: 700;
  color: #c9a227; margin-bottom: 10px; letter-spacing: 0.5px;
}
#bv-reading-text {
  font-family: 'Crimson Text', serif;
  font-size: 17px; line-height: 1.65;
  color: #e2e8f0; font-style: italic;
}
#bv-reading-not-found {
  font-family: 'Crimson Text', serif;
  font-size: 15px; color: #64748b; font-style: italic;
}

</style>
</head>
<body>

  <!-- == WHAM MENU WRAP ======================================= -->
  <div class="wham-menu-wrap" id="whamMenu">
    <button class="wham-menu-btn" id="menuToggleBtn" onclick="whamMenuToggle()" aria-label="Menu">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </button>
    <div class="wham-menu-panel" id="menuPanel" style="display:none;">

      <button class="wham-menu-item" onclick="whamMenuGo('leaderboard')">
        <span class="m-icon">🏆</span><span class="m-label">Leaderboard</span>
      </button>
      <button class="wham-menu-item" onclick="whamMenuGo('learning')">
        <span class="m-icon">🎓</span><span class="m-label">Learning Center</span>
      </button>
      <button class="wham-menu-item" onclick="whamMenuGo('versePack')">
        <span class="m-icon">📦</span><span class="m-label">Custom Verse Pack</span>
      </button>
      <button class="wham-menu-item" onclick="whamMenuGo('myScores')">
        <span class="m-icon">📊</span><span class="m-label">My Scores</span>
      </button>
      <button class="wham-menu-item" onclick="whamMenuGo('playerList')">
        <span class="m-icon">👥</span><span class="m-label">Player List</span>
      </button>

      <!-- Bible Verses — replaces Theme Store -->
      <button class="wham-menu-item" onclick="whamMenuGo('bibleVerses')">
        <span class="m-icon">📖</span><span class="m-label">Bible Verses</span>
      </button>

      <button class="wham-menu-item" onclick="whamMenuGo('howToPlay')">
        <span class="m-icon">❓</span><span class="m-label">How to Play</span>
      </button>
      <button class="wham-menu-item" onclick="whamMenuGo('invite')">
        <span class="m-icon">🎉</span><span class="m-label">Invite Friends</span>
      </button>
      <button class="wham-menu-item" onclick="whamMenuGo('profile')">
        <span class="m-icon">👤</span><span class="m-label">My Profile</span>
      </button>
      <a class="wham-menu-item" href="https://whambible.org" target="_blank" rel="noopener">
        <span class="m-icon">❤️</span><span class="m-label">Donate — whambible.org</span>
      </a>
      <button class="wham-menu-item signout" id="menuSignOut" onclick="whamMenuGo('signout')" style="display:none;">
        <span class="m-icon">🚪</span><span class="m-label">Sign Out</span>
      </button>

    </div><!-- /panel -->
  </div><!-- /wrap -->

  <!-- == BIBLE VERSES MODAL =================================== -->
  <div id="bv-modal-overlay" style="display:none;" onclick="bvOverlayClick(event)">
    <div id="bv-modal">
      <div id="bv-header">
        <span style="font-size:20px;">📖</span>
        <h2>Bible Verses</h2>
        <button id="bv-close" onclick="bvClose()">✕</button>
      </div>

      <!-- Scroll Wheels -->
      <div id="bv-wheels">
        <div class="bv-wheel-wrap" id="bv-wheel-book">
          <div class="bv-wheel-label">Book</div>
          <div class="bv-wheel-outer" id="bv-outer-book">
            <div class="bv-wheel-inner" id="bv-inner-book"></div>
            <div class="bv-selector-band"></div>
          </div>
        </div>
        <div class="bv-wheel-wrap" id="bv-wheel-ch">
          <div class="bv-wheel-label">Ch</div>
          <div class="bv-wheel-outer" id="bv-outer-ch">
            <div class="bv-wheel-inner" id="bv-inner-ch"></div>
            <div class="bv-selector-band"></div>
          </div>
        </div>
        <div class="bv-wheel-wrap" id="bv-wheel-vs">
          <div class="bv-wheel-label">Vs</div>
          <div class="bv-wheel-outer" id="bv-outer-vs">
            <div class="bv-wheel-inner" id="bv-inner-vs"></div>
            <div class="bv-selector-band"></div>
          </div>
        </div>
      </div><!-- /wheels -->

      <button id="bv-read-btn" onclick="bvReadVerse()">📜 Read Verse</button>

      <!-- Reading Pane -->
      <div id="bv-reading-pane">
        <div id="bv-reading-ref"></div>
        <div id="bv-reading-text"></div>
      </div>

    </div><!-- /modal -->
  </div><!-- /overlay -->

  <div class="bg-overlay"></div>

  <!-- HUD -->
  <header class="game-hud">
    <button class="hud-back" onclick="confirmExit()">← Exit</button>
    <div class="hud-center">
      <span class="hud-level" id="hud-level">⚔️ Warrior · 10pts</span>
    </div>
    <div class="hud-score-wrap">
      <span class="hud-score-label">SCORE</span>
      <span class="hud-score" id="hud-score">0</span>
    </div>
  </header>

  <!-- Timer Bar -->
  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timer-bar"></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <span class="progress-text" id="progress-text">Verse 1 of 5</span>
    <div class="progress-dots" id="progress-dots"></div>
  </div>

  <main class="game-content">

    <!-- Verse Display Card -->
    <section class="verse-display-card" id="verse-card">
      <div class="verse-ornament">✦ ✦ ✦</div>
      <p class="verse-body" id="verse-body">Loading...</p>
      <div class="verse-ornament">✦ ✦ ✦</div>
      <div class="verse-challenge-label" id="challenge-label">Where is this verse found?</div>
    </section>

    <!-- Multiple Choice Grid -->
    <section class="choices-section">
      <p class="choices-label">Select the correct Book · Chapter · Verse</p>
      <div class="choices-grid" id="choices-grid">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- Streak / Feedback -->
    <div class="feedback-bar" id="feedback-bar"></div>

  </main>

  <!-- Result Overlay -->
  <div class="result-overlay" id="result-overlay" style="display:none">
    <div class="result-card">
      <div class="result-icon" id="result-icon">✅</div>
      <h2 class="result-title" id="result-title">Correct!</h2>
      <p class="result-verse" id="result-verse-ref"></p>
      <p class="result-body" id="result-body"></p>
      <button class="btn-primary result-next" id="result-next-btn" onclick="nextVerse()">Next Verse ⚔️</button>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div class="result-overlay" id="gameover-overlay" style="display:none">
    <div class="result-card">
      <div class="result-icon">🏆</div>
      <h2 class="result-title" id="final-title">Battle Complete!</h2>
      <p class="result-body" id="final-score-display"></p>
      <div class="final-stats" id="final-stats"></div>
      <button class="btn-primary result-next" onclick="restartGame()">Play Again ⚔️</button>
      <button class="btn-secondary result-next" style="margin-top:10px" onclick="window.location.href='index.html'">← Home</button>
    </div>
  </div>

  <script src="verses.js"></script>
  <script src="game.js"></script>
<script>

// ============================================================
// WHAM MENU + BIBLE VERSES — live lookup via bible-api.com
// ============================================================
(function() {

  const BV_BOOKS    = ['Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy', 'Joshua', 'Judges', 'Ruth', '1 Samuel', '2 Samuel', '1 Kings', '2 Kings', '1 Chronicles', '2 Chronicles', 'Ezra', 'Nehemiah', 'Esther', 'Job', 'Psalms', 'Proverbs', 'Ecclesiastes', 'Song of Solomon', 'Isaiah', 'Jeremiah', 'Lamentations', 'Ezekiel', 'Daniel', 'Hosea', 'Joel', 'Amos', 'Obadiah', 'Jonah', 'Micah', 'Nahum', 'Habakkuk', 'Zephaniah', 'Haggai', 'Zechariah', 'Malachi', 'Matthew', 'Mark', 'Luke', 'John', 'Acts', 'Romans', '1 Corinthians', '2 Corinthians', 'Galatians', 'Ephesians', 'Philippians', 'Colossians', '1 Thessalonians', '2 Thessalonians', '1 Timothy', '2 Timothy', 'Titus', 'Philemon', 'Hebrews', 'James', '1 Peter', '2 Peter', '1 John', '2 John', '3 John', 'Jude', 'Revelation'];
  const BV_CHAPTERS = {'Genesis': 50, 'Exodus': 40, 'Leviticus': 27, 'Numbers': 36, 'Deuteronomy': 34, 'Joshua': 24, 'Judges': 21, 'Ruth': 4, '1 Samuel': 31, '2 Samuel': 24, '1 Kings': 22, '2 Kings': 25, '1 Chronicles': 29, '2 Chronicles': 36, 'Ezra': 10, 'Nehemiah': 13, 'Esther': 10, 'Job': 42, 'Psalms': 150, 'Proverbs': 31, 'Ecclesiastes': 12, 'Song of Solomon': 8, 'Isaiah': 66, 'Jeremiah': 52, 'Lamentations': 5, 'Ezekiel': 48, 'Daniel': 12, 'Hosea': 14, 'Joel': 3, 'Amos': 9, 'Obadiah': 1, 'Jonah': 4, 'Micah': 7, 'Nahum': 3, 'Habakkuk': 3, 'Zephaniah': 3, 'Haggai': 2, 'Zechariah': 14, 'Malachi': 4, 'Matthew': 28, 'Mark': 16, 'Luke': 24, 'John': 21, 'Acts': 28, 'Romans': 16, '1 Corinthians': 16, '2 Corinthians': 13, 'Galatians': 6, 'Ephesians': 6, 'Philippians': 4, 'Colossians': 4, '1 Thessalonians': 5, '2 Thessalonians': 3, '1 Timothy': 6, '2 Timothy': 4, 'Titus': 3, 'Philemon': 1, 'Hebrews': 13, 'James': 5, '1 Peter': 5, '2 Peter': 3, '1 John': 5, '2 John': 1, '3 John': 1, 'Jude': 1, 'Revelation': 22};
  const CELL_H      = 40;
  const bvW         = {};
  let menuOpen      = false;

  // ── Menu toggle ────────────────────────────────────────────
  window.whamMenuToggle = function() {
    menuOpen = !menuOpen;
    const btn   = document.getElementById('menuToggleBtn');
    const panel = document.getElementById('menuPanel');
    if (btn)   btn.classList.toggle('open', menuOpen);
    if (panel) panel.style.display = menuOpen ? 'block' : 'none';
  };

  window.whamMenuGo = function(screen) {
    menuOpen = false;
    const btn   = document.getElementById('menuToggleBtn');
    const panel = document.getElementById('menuPanel');
    if (btn)   btn.classList.remove('open');
    if (panel) panel.style.display = 'none';
    switch(screen) {
      case 'bibleVerses': bvOpen(); break;
      case 'leaderboard':  whamPlaceholder('🏆 Leaderboard — coming soon'); break;
      case 'learning':     whamPlaceholder('🎓 Learning Center — coming soon'); break;
      case 'versePack':    whamPlaceholder('📦 Custom Verse Pack — coming soon'); break;
      case 'myScores':     whamPlaceholder('📊 My Scores — coming soon'); break;
      case 'playerList':   whamPlaceholder('👥 Player List — coming soon'); break;
      case 'howToPlay':    whamPlaceholder('❓ How to Play — coming soon'); break;
      case 'invite':       whamPlaceholder('🎉 Invite Friends — coming soon'); break;
      case 'profile':      whamPlaceholder('👤 My Profile — coming soon'); break;
      case 'signout':      whamPlaceholder('🚪 Sign Out — coming soon'); break;
    }
  };

  function whamPlaceholder(msg) {
    let t = document.getElementById('toast') || document.getElementById('menu-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'menu-toast';
      t.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1e293b;color:#c9a227;border:1px solid #c9a227;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.2s;';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._t); t._t = setTimeout(() => { t.style.opacity = '0'; }, 2400);
  }

  document.addEventListener('mousedown', function(e) {
    const wrap = document.getElementById('whamMenu');
    if (wrap && !wrap.contains(e.target) && menuOpen) whamMenuToggle();
  });

  // ── Bible Verses modal ─────────────────────────────────────
  function bvOpen() {
    const overlay = document.getElementById('bv-modal-overlay');
    if (!overlay) return;
    overlay.style.display = 'flex';
    document.getElementById('bv-reading-pane').style.display = 'none';
    if (!bvW.book) {
      bvInitWheel('book', BV_BOOKS, 0);
      const maxCh = BV_CHAPTERS[BV_BOOKS[0]] || 50;
      bvInitWheel('ch', bvRange(1, maxCh), 0);
      bvInitWheel('vs', bvRange(1, 50), 0);
    }
  }

  window.bvClose = function() {
    const overlay = document.getElementById('bv-modal-overlay');
    if (overlay) overlay.style.display = 'none';
  };

  window.bvOverlayClick = function(e) {
    if (e.target === document.getElementById('bv-modal-overlay')) bvClose();
  };

  function bvRange(from, to) {
    return Array.from({length: to - from + 1}, (_, i) => String(from + i));
  }

  // ── Wheel ──────────────────────────────────────────────────
  function bvInitWheel(id, items, startIdx) {
    const inner = document.getElementById('bv-inner-' + id);
    const outer = document.getElementById('bv-outer-' + id);
    if (!inner || !outer) return;
    const state = { items, index: startIdx, dragging: false, startY: 0, dragOffset: 0, velocity: 0, lastY: 0, lastT: 0 };
    bvW[id] = state;
    bvRenderCells(id);
    bvSetOffset(id, 0, false);
    outer.addEventListener('touchstart',  e => bvDragStart(id, e.touches[0].clientY), {passive:true});
    outer.addEventListener('touchmove',   e => { e.preventDefault(); bvDragMove(id, e.touches[0].clientY); }, {passive:false});
    outer.addEventListener('touchend',    () => bvDragEnd(id));
    outer.addEventListener('mousedown',   e => bvDragStart(id, e.clientY));
    window.addEventListener('mousemove',  e => { if (bvW[id] && bvW[id].dragging) bvDragMove(id, e.clientY); });
    window.addEventListener('mouseup',    () => { if (bvW[id] && bvW[id].dragging) bvDragEnd(id); });
  }

  function bvRenderCells(id) {
    const state = bvW[id];
    const inner = document.getElementById('bv-inner-' + id);
    inner.innerHTML = '';
    const items = state.items;
    const reps  = Math.max(3, Math.ceil(90 / items.length));
    state._totalCells = items.length * reps;
    state._startPad   = Math.floor(reps / 2) * items.length;
    for (let r = 0; r < reps; r++) {
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'bv-wheel-cell';
        div.textContent = item;
        inner.appendChild(div);
      });
    }
    bvHighlight(id);
  }

  function bvSetOffset(id, pxOffset, animate) {
    const state = bvW[id];
    const inner = document.getElementById('bv-inner-' + id);
    if (!inner) return;
    const px = -state.index * CELL_H + state._startPad * CELL_H + 60 - pxOffset;
    inner.style.transition = animate ? 'transform 0.22s cubic-bezier(.22,.68,0,1.2)' : 'none';
    inner.style.transform  = `translateY(${px}px)`;
    bvHighlight(id);
  }

  function bvHighlight(id) {
    const state = bvW[id];
    const inner = document.getElementById('bv-inner-' + id);
    if (!inner) return;
    const selI = state._startPad + state.index;
    inner.querySelectorAll('.bv-wheel-cell').forEach((c, i) => c.classList.toggle('selected', i === selI));
  }

  function bvDragStart(id, y) {
    const s = bvW[id];
    s.dragging = true; s.startY = y; s.dragOffset = 0;
    s.lastY = y; s.lastT = Date.now(); s.velocity = 0;
  }

  function bvDragMove(id, y) {
    const s = bvW[id];
    if (!s.dragging) return;
    const now = Date.now();
    s.velocity   = (y - s.lastY) / Math.max(1, now - s.lastT) * 16;
    s.lastY = y; s.lastT = now;
    s.dragOffset = -(y - s.startY);
    bvSetOffset(id, s.dragOffset, false);
  }

  function bvDragEnd(id) {
    const s = bvW[id];
    if (!s.dragging) return;
    s.dragging = false;
    let delta = Math.round(s.dragOffset / CELL_H) + (-Math.round(s.velocity * 2 / CELL_H));
    s.index = Math.max(0, Math.min(s.items.length - 1, s.index + delta));
    s.dragOffset = 0;
    bvSetOffset(id, 0, true);
    if (id === 'book') bvOnBookChange();
  }

  function bvOnBookChange() {
    const book  = BV_BOOKS[bvW.book.index];
    const maxCh = BV_CHAPTERS[book] || 50;
    bvW.ch.items = bvRange(1, maxCh);
    bvW.ch.index = 0;
    bvRenderCells('ch');
    bvSetOffset('ch', 0, true);
    // Reset verse wheel too
    bvW.vs.items = bvRange(1, 50);
    bvW.vs.index = 0;
    bvRenderCells('vs');
    bvSetOffset('vs', 0, true);
  }

  // ── Read Verse — live fetch from bible-api.com ─────────────
  window.bvReadVerse = function() {
    if (!bvW.book) return;
    const book    = BV_BOOKS[bvW.book.index];
    const chapter = bvW.ch.items[bvW.ch.index];
    const verse   = bvW.vs.items[bvW.vs.index];
    const ref     = `${book} ${chapter}:${verse}`;

    const pane   = document.getElementById('bv-reading-pane');
    const refEl  = document.getElementById('bv-reading-ref');
    const textEl = document.getElementById('bv-reading-text');

    // Show loading state
    refEl.textContent  = ref;
    textEl.innerHTML   = '<span style="color:#64748b;font-style:italic;">Loading...</span>';
    pane.style.display = 'block';
    pane.scrollIntoView({behavior:'smooth', block:'nearest'});

    // 1. Check local VERSES dataset first (instant)
    if (typeof VERSES !== 'undefined') {
      const local = VERSES.find(v =>
        v.book === book &&
        v.chapter === parseInt(chapter) &&
        v.verse   === parseInt(verse)
      );
      if (local) {
        textEl.innerHTML = `"${local.text}"`;
        return;
      }
    }

    // 2. Fetch from bible-api.com (KJV, no key required)
    // Encode spaces as + for URL
    const query = encodeURIComponent(`${book} ${chapter}:${verse}`);
    const url   = `https://bible-api.com/${query}?translation=kjv`;

    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error('Not found');
        return r.json();
      })
      .then(data => {
        if (data.text) {
          const text = data.text.trim().replace(/
/g, ' ');
          textEl.innerHTML = `"${text}"
            <div style="font-size:11px;color:#64748b;margin-top:8px;font-style:normal;">KJV · bible-api.com</div>`;
        } else {
          textEl.innerHTML = '<span style="color:#64748b;font-style:italic;">Verse not found.</span>';
        }
      })
      .catch(() => {
        textEl.innerHTML = '<span style="color:#64748b;font-style:italic;">Could not load verse. Check connection.</span>';
      });
  };

})();

</script>
</body>
</html>
