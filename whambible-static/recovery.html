/* ============================================================
   DROPDOWN MENU — exact Whamgame structure
   ============================================================ */
@keyframes menuFade {
  from { opacity: 0; transform: translateY(-8px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)   scale(1);     }
}

.wham-menu-wrap {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 3000;
}

/* Hamburger toggle button */
.wham-menu-btn {
  width: 44px;
  height: 44px;
  background: rgba(15, 23, 42, 0.90);
  border: 1px solid #334155;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.wham-menu-btn.open {
  background: rgba(201, 162, 39, 0.15);
  border-color: #c9a227;
}
.wham-menu-btn .bar {
  width: 18px;
  height: 2px;
  background: #94a3b8;
  border-radius: 2px;
  transition: all 0.22s ease;
}
.wham-menu-btn.open .bar { background: #c9a227; }
.wham-menu-btn.open .bar:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.wham-menu-btn.open .bar:nth-child(2) { opacity: 0; }
.wham-menu-btn.open .bar:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* Dropdown panel */
.wham-menu-panel {
  position: absolute;
  top: 52px;
  right: 0;
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  min-width: 220px;
  animation: menuFade 0.15s ease;
}

/* Each menu row */
.wham-menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 18px;
  background: transparent;
  border: none;
  border-bottom: 1px solid #1e293b;
  color: #e2e8f0;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
  text-decoration: none;
}
.wham-menu-item:last-child { border-bottom: none; }
.wham-menu-item:hover { background: rgba(201, 162, 39, 0.10); }
.wham-menu-item .m-icon { font-size: 18px; }
.wham-menu-item .m-label { flex: 1; }

/* PRO badge (locked items) */
.wham-menu-badge-pro {
  font-size: 10px;
  background: linear-gradient(135deg, #c9a227, #a07720);
  color: #fff;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

/* Theme sub-menu toggle */
.wham-menu-item.theme-toggle .m-arrow {
  font-size: 12px;
  color: #64748b;
  transition: transform 0.2s;
}
.wham-menu-item.theme-toggle.sub-open .m-arrow { transform: rotate(180deg); }

/* Theme submenu rows */
.wham-submenu {
  background: rgba(15, 23, 42, 0.95);
  border-top: 1px solid #1e293b;
  display: none;
}
.wham-submenu.open { display: block; }
.wham-submenu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 18px 11px 32px;

  border: none;
  border-bottom: 1px solid rgba(30, 41, 59, 0.6);

  font-family: inherit;

  text-align: left;

}
.wham-submenu-item:last-child { border-bottom: none; }
.wham-submenu-item:hover { background: rgba(201,162,39,0.08); }
.wham-submenu-badge {

  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 800;
}
.wham-submenu-badge.owned {

  border: 1px solid #4ade80;
}

/* Divider inside menu */

#bv-close:hover { color: #f87171; }

/* Wheels row */
#bv-wheels {
  display: flex; gap: 8px;
  padding: 18px 20px 10px;
  justify-content: center;
}
.bv-wheel-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.bv-wheel-label {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  color: #64748b; text-transform: uppercase;
}
.bv-wheel-outer {
  position: relative;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
  background: #020617;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.bv-wheel-outer:active { cursor: grabbing; }
/* Book wider, ch/vs narrower */
#bv-wheel-book   .bv-wheel-outer { width: 148px; height: 160px; }
#bv-wheel-ch     .bv-wheel-outer { width: 64px;  height: 160px; }
#bv-wheel-vs     .bv-wheel-outer { width: 64px;  height: 160px; }

.bv-wheel-inner {
  position: absolute; left: 0; right: 0; top: 0;
  transition: transform 0.12s cubic-bezier(.22,.68,0,1.2);
}
.bv-wheel-cell {
  display: flex; align-items: center; justify-content: center;
  height: 40px;
  font-family: 'Crimson Text', serif;
  font-size: 14px; font-weight: 600;
  color: #94a3b8;
  transition: color 0.15s, font-size 0.15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 8px;
}
.bv-wheel-cell.selected {
  color: #c9a227; font-size: 15px; font-weight: 700;
}
/* Gradient masks top/bottom */
.bv-wheel-outer::before,
.bv-wheel-outer::after {
  content: ''; position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none;
  height: 52px;
}
.bv-wheel-outer::before { top: 0;    background: linear-gradient(to bottom, #020617 0%, transparent 100%); }
.bv-wheel-outer::after  { bottom: 0; background: linear-gradient(to top,    #020617 0%, transparent 100%); }
/* Selector band */
.bv-selector-band {
  position: absolute; left: 6px; right: 6px;
  top: 60px; height: 40px;
  border-top: 1px solid rgba(201,162,39,0.5);
  border-bottom: 1px solid rgba(201,162,39,0.5);
  background: rgba(201,162,39,0.07);
  border-radius: 6px;
  pointer-events: none; z-index: 3;
}

/* Read Verse button */

  font-family: 'Cinzel', serif; letter-spacing: 0.5px;

#bv-read-btn:hover  { opacity: 0.9; }
#bv-read-btn:active { transform: scale(0.98); }

<!-- ── Firebase SDK ──────────────────────────────────────── -->
<script type="module">
  import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInWithPopup, signInAnonymously,
           GoogleAuthProvider, createUserWithEmailAndPassword,
           signInWithEmailAndPassword, signOut }
                                    from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, getDoc, collection,
           addDoc, updateDoc, onSnapshot, serverTimestamp, query, where, orderBy, limit }
                                    from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
  import { getMessaging, getToken, onMessage }
                                    from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-messaging.js';

  const firebaseConfig = {
  apiKey: "%%FIREBASE_API_KEY%%",
  authDomain: "wham-bible.firebaseapp.com",
  projectId: "wham-bible",
  storageBucket: "wham-bible.firebasestorage.app",
  messagingSenderId: "207184555743",
  appId: "1:207184555743:web:0bd4b8350701d02f79836a",
  measurementId: "G-HLCH54DQPN"
};
  const fbApp  = initializeApp(firebaseConfig);
  const auth   = getAuth(fbApp);
  const db     = getFirestore(fbApp);
  const messaging = getMessaging(fbApp);

  // ── Expose globals ──────────────────────────────────────
  window._fb = { fbApp, auth, db, messaging,
    signInWithPopup, signInAnonymously, GoogleAuthProvider,
    createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged, updateProfile,
    doc, setDoc, getDoc, collection, addDoc, updateDoc,
    onSnapshot, serverTimestamp, query, where, orderBy, limit };

  // ── Auth state listener ─────────────────────────────────
  onAuthStateChanged(auth, async user => {
    window._fbUser = user;
    if (user) {
      // Upsert player profile in Firestore
      const ref = doc(db, 'players', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid:         user.uid,
          displayName: user.displayName || user.email || 'Anonymous',
          email:       user.email || '',
          photoURL:    user.photoURL || '',
          isAnonymous: user.isAnonymous,
          createdAt:   serverTimestamp(),
          score:       0,
          gamesPlayed: 0,
          streak:      0
        });
      }
      // Register FCM token
      try {
        const fcmToken = await getToken(messaging, { vapidKey: 'BKfAsLFqwK3E_eUGVRqbk27nO-PA5jONM6ekOop3Vp2U3vXH384dtK5WZnlWVtThnkdn37rvQQuxiHjTnYwEPDI' });
        if (fcmToken) {
          await updateDoc(ref, { fcmToken, lastSeen: serverTimestamp() });
          window._fcmToken = fcmToken;
        }
      } catch(e) { console.warn('FCM token:', e); }
      // Sync verse pack to Firestore
      whamSyncVersePack && whamSyncVersePack(user.uid);
    }
    // Dispatch event so UI can react
    document.dispatchEvent(new CustomEvent('whamAuthChange', { detail: user }));
  });

  // ── FCM foreground messages ─────────────────────────────
  onMessage(messaging, payload => {
    const n = payload.notification || {};
    whamPlaceholder && whamPlaceholder('🔔 ' + (n.title || '') + ': ' + (n.body || ''));
  });

  console.log('🔥 Firebase wired — wham-bible');
</script>

<script>

// ============================================================
// WHAM MENU — exact Whamgame tab structure
// ============================================================
(function() {
  let menuOpen = false;
  let themeOpen = false;

  window.whamMenuToggle = function() {
    menuOpen = !menuOpen;
    const btn   = document.getElementById('menuToggleBtn');
    const panel = document.getElementById('menuPanel');
    btn.classList.toggle('open', menuOpen);
    panel.style.display = menuOpen ? 'block' : 'none';
    if (!menuOpen) {
      // close theme submenu too
      themeOpen = false;
      document.getElementById('themeSubmenu').classList.remove('open');
      document.getElementById('themeToggleBtn').classList.remove('sub-open');
    }
  };

  window.whamMenuThemeToggle = function() {
    themeOpen = !themeOpen;
    document.getElementById('themeSubmenu').classList.toggle('open', themeOpen);
    document.getElementById('themeToggleBtn').classList.toggle('sub-open', themeOpen);
  };

  window.whamMenuGo = function(screen, sub) {
    menuOpen = false;
    themeOpen = false;
    document.getElementById('menuToggleBtn').classList.remove('open');
    document.getElementById('menuPanel').style.display = 'none';
    document.getElementById('themeSubmenu').classList.remove('open');
    document.getElementById('themeToggleBtn').classList.remove('sub-open');

    // ── Route each tab ──────────────────────────────────────
    switch(screen) {
      case 'leaderboard':
        // PLACEHOLDER: navigate to leaderboard page / open modal
        whamPlaceholder('🏆 Leaderboard — coming soon');
        break;
      case 'learning':
        // PLACEHOLDER: open missed-verse review mode
        whamPlaceholder('🎓 Learning Center — coming soon');
        break;
      case 'versePack':
        // PLACEHOLDER: custom verse pack builder
        whamPlaceholder('📦 Custom Verse Pack — coming soon');
        break;
      case 'myScores':
        // PLACEHOLDER: personal match history screen
        whamPlaceholder('📊 My Scores — coming soon');
        break;
      case 'playerList':
        // PLACEHOLDER: friends roster + matchmaking
        whamPlaceholder('👥 Player List — coming soon');
        break;
      case 'howToPlay':
        // PLACEHOLDER: tutorial overlay
        whamPlaceholder('❓ How to Play — coming soon');
        break;
      case 'invite':
        // PLACEHOLDER: share deep link
        whamPlaceholder('🎉 Invite Friends — coming soon');
        break;
      case 'theme':
        // PLACEHOLDER: theme purchase / unlock (sub = theme key)
        whamPlaceholder('🎨 Theme: ' + (sub||'') + ' — purchase coming soon');
        break;
      case 'profile':
        // PLACEHOLDER: profile screen (avatar, username, stats)
        whamPlaceholder('👤 My Profile — coming soon');
        break;
      case 'signout':
        // PLACEHOLDER: Firebase sign-out + redirect to home
        whamPlaceholder('🚪 Sign Out — coming soon');
        break;
    }
  };

  // Show toast for placeholders
  function whamPlaceholder(msg) {
    let toast = document.getElementById('toast') || document.getElementById('menu-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'menu-toast';
      toast.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1e293b;color:#c9a227;border:1px solid #c9a227;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.2s;';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.style.opacity = '0'; }, 2200);
  }

  // Close menu when clicking outside
  document.addEventListener('mousedown', function(e) {
    const wrap = document.getElementById('whamMenu');
    if (wrap && !wrap.contains(e.target) && menuOpen) {
      whamMenuToggle();
    }
  });
})();

</script>

<script>
// ── Auth helpers ────────────────────────────────────────────
window.whamSignInGoogle = async function() {
  const { auth, signInWithPopup, GoogleAuthProvider } = window._fb;
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) { whamPlaceholder('Sign-in cancelled'); }
};

window.whamSignInEmail = async function(email, password) {
  const { auth, signInWithEmailAndPassword } = window._fb;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(e) { whamPlaceholder('⚠️ ' + e.message); }
};

window.whamSignUpEmail = async function(email, password) {
  const { auth, createUserWithEmailAndPassword } = window._fb;
  try {
    await createUserWithEmailAndPassword(auth, email, password);
  } catch(e) { whamPlaceholder('⚠️ ' + e.message); }
};

window.whamSignInGuest = async function() {
  const { auth, signInAnonymously } = window._fb;
  try { await signInAnonymously(auth); }
  catch(e) { whamPlaceholder('⚠️ ' + e.message); }
};

window.whamSignOut = async function() {
  const { auth, signOut } = window._fb;
  await signOut(auth);
  window._fbUser = null;
  whamPlaceholder('👋 Signed out');
};

// ── Verse pack cloud sync ───────────────────────────────────
window.whamSyncVersePack = async function(uid) {
  if (!window._fb || !uid) return;
  const { db, doc, setDoc, getDoc } = window._fb;
  const local = JSON.parse(localStorage.getItem('whamVersePack') || 'null');
  const ref   = doc(db, 'versePacks', uid);
  const snap  = await getDoc(ref);
  if (snap.exists()) {
    // Merge: cloud wins for filled slots, local fills the rest
    const cloud = snap.data().slots || [];
    const merged = cloud.map((s, i) => s || (local && local[i]) || null);
    localStorage.setItem('whamVersePack', JSON.stringify(merged));
  } else if (local) {
    await setDoc(ref, { uid, slots: local, updatedAt: window._fb.serverTimestamp() });
  }
};

window.whamPushVersePack = async function() {
  if (!window._fb || !window._fbUser) return;
  const { db, doc, setDoc, serverTimestamp } = window._fb;
  const local = JSON.parse(localStorage.getItem('whamVersePack') || '[]');
  await setDoc(doc(db, 'versePacks', window._fbUser.uid),
    { uid: window._fbUser.uid, slots: local, updatedAt: serverTimestamp() });
};

// ── Auth change → update profile UI ────────────────────────
document.addEventListener('whamAuthChange', e => {
  const user = e.detail;
  const nameEl  = document.getElementById('profile-name');
  const photoEl = document.getElementById('profile-photo');
  const loginBtn = document.getElementById('btn-login');
  const logoutBtn = document.getElementById('btn-logout');
  if (nameEl)   nameEl.textContent  = user ? (user.displayName || user.email || 'Guest') : '';
  if (photoEl)  photoEl.src         = user ? (user.photoURL || '') : '';
  if (loginBtn)  loginBtn.style.display  = user ? 'none' : 'flex';
  if (logoutBtn) logoutBtn.style.display = user ? 'flex' : 'none';
});
</script>

</body>
</html>
